<!DOCTYPE html>

<head>

<title>Contenuto Laboratorio</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Stili identici a quelli del file originale, ma specifici per il contenuto dell'iframe */
:root{--blu:#1B3A6B;--blu2:#2A5298;--avorio:#F8F6F1;--ambra:#C97D2E;--verde:#2D6A4F;--rosso:#C0392B;--grigio:#6B7280;--gc:#E8E4DC;--bianco:#fff;--ombra:0 4px 24px rgba(27,58,107,.12);--viola:#68458b}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"IBM Plex Sans",sans-serif;background:var(--avorio);color:var(--blu);min-height:100vh}button,input,textarea,select{font-family:"IBM Plex Sans",sans-serif}.mono{font-family:"IBM Plex Mono",monospace}.hidden{display:none!important}
main{flex:1;padding:1.15rem;max-width:1020px;margin:0 auto;width:100%}.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}.layout.fac{grid-template-columns:minmax(0,1.1fr) 360px}.card{background:#fff;border-radius:13px;padding:1.35rem;margin-bottom:1rem;box-shadow:var(--ombra);border-left:4px solid var(--blu)}.card.ambra{border-left-color:var(--ambra)}.card.verde{border-left-color:var(--verde)}.card.rosso{border-left-color:var(--rosso)}.card.viola{border-left-color:var(--viola)}.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--grigio);margin-bottom:.55rem}.ctitle{font-size:1.12rem;font-weight:800;color:var(--blu);margin-bottom:.65rem;line-height:1.25}.cbody{font-size:.9rem;line-height:1.68;color:#374151}.hbox{background:rgba(201,125,46,.08);border:1px solid rgba(201,125,46,.22);border-radius:9px;padding:.85rem;margin-top:.85rem;font-size:.87rem;line-height:1.55;color:#374151}.dangerbox{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.22);border-radius:9px;padding:.85rem;margin-top:.85rem;font-size:.87rem;line-height:1.55;color:#5d1c16}.quote{font-size:1rem;font-weight:700;line-height:1.45;color:var(--blu);border-left:4px solid var(--ambra);padding-left:.8rem;margin:.8rem 0}.pill{display:inline-block;padding:.24rem .58rem;border-radius:16px;background:rgba(27,58,107,.08);font-size:.72rem;font-weight:700;color:var(--blu);margin:.12rem .2rem .12rem 0}.pill.red{background:rgba(192,57,43,.1);color:var(--rosso)}.pill.green{background:rgba(45,106,79,.1);color:var(--verde)}.pill.amber{background:rgba(201,125,46,.12);color:#8a5317}
.opts{display:flex;flex-direction:column;gap:.55rem;margin-top:.85rem}.opt{position:relative;padding:.82rem .95rem;border:2px solid var(--gc);border-radius:10px;background:#fff;cursor:pointer;transition:all .18s;overflow:hidden}.opt:hover:not(.locked){border-color:var(--blu2);background:rgba(27,58,107,.04)}.opt.sel{border-color:var(--ambra);background:rgba(201,125,46,.08)}.opt.locked{cursor:default}.opt.bad{border-color:rgba(192,57,43,.28)}.opt.good{border-color:rgba(45,106,79,.28)}.opt .olabel{font-weight:600;color:#25364d;font-size:.88rem;line-height:1.42}.opt .odesc{font-size:.75rem;line-height:1.45;color:var(--grigio);margin-top:.15rem}.locknote{font-size:.78rem;color:var(--verde);font-weight:700;margin-top:.7rem}.muted{color:var(--grigio);font-size:.8rem;line-height:1.5}.save-btn,.nbtn{padding:.56rem 1rem;border-radius:8px;border:2px solid var(--blu);background:var(--blu);color:var(--avorio);font-weight:700;cursor:pointer;transition:all .16s}.save-btn:hover,.nbtn:hover{background:var(--blu2);border-color:var(--blu2)}.nbtn.alt{background:#fff;color:var(--blu)}.nbtn.alt:hover{background:rgba(27,58,107,.06);border-color:var(--blu2)}.nbtn.danger{background:#fff;color:var(--rosso);border-color:var(--rosso)}.nbtn.danger:hover{background:var(--rosso);color:white}.nbtn.green{background:var(--verde);border-color:var(--verde)}.nbtn.green:hover{background:#1e4d38;border-color:#1e4d38}.btnrow{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:.85rem}.fac-panel{background:rgba(27,58,107,.04);border:1px solid rgba(27,58,107,.12);border-radius:12px;padding:1rem;margin-bottom:1rem}.fac-panel h3{font-size:.67rem;text-transform:uppercase;letter-spacing:.15em;color:var(--grigio);font-family:"IBM Plex Mono",monospace;margin-bottom:.75rem}.group-list{display:flex;flex-direction:column;gap:.5rem}.gcard{background:#fff;border:1px solid var(--gc);border-left:4px solid var(--ambra);border-radius:9px;padding:.6rem .7rem}.gname{font-weight:800;font-size:.85rem;color:var(--blu)}.grole{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grigio);font-weight:700;margin-top:.08rem}.gchoices{font-size:.74rem;line-height:1.45;color:#374151;margin-top:.35rem}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin:.75rem 0}.stat{text-align:center;background:#fff;border:1px solid var(--gc);border-radius:8px;padding:.45rem}.statn{font-family:"IBM Plex Mono",monospace;font-size:1.2rem;font-weight:700;color:var(--blu)}.statl{font-size:.62rem;color:var(--grigio);margin-top:.12rem}
.result-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.85rem}.resrow{background:#fff;border:1px solid var(--gc);border-radius:9px;padding:.6rem .72rem}.reshead{display:flex;justify-content:space-between;gap:.8rem;align-items:center}.reslabel{font-weight:700;font-size:.84rem;color:#25364d}.respct{font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:800;color:var(--blu)}.resbar{height:7px;background:var(--gc);border-radius:10px;margin-top:.45rem;overflow:hidden}.resfill{height:100%;width:0%;background:var(--ambra);border-radius:10px;transition:width .5s}.voters{font-size:.7rem;line-height:1.45;color:var(--grigio);margin-top:.38rem}.voters strong{color:var(--blu)}
.phases-bar{background:#fff;border-bottom:1px solid var(--gc);padding:0 1.2rem;display:flex;overflow-x:auto;scrollbar-width:none}.phases-bar::-webkit-scrollbar{display:none}.ptab{padding:.62rem 1rem;font-size:.76rem;font-weight:600;color:var(--grigio);cursor:default;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}.ptab.active{color:var(--blu);border-bottom-color:var(--ambra);font-weight:700}.ptab.done{color:var(--verde)}.ptab .tt{font-family:"IBM Plex Mono",monospace;font-size:.58rem;color:var(--grigio);display:block}
.persona-card { background: var(--bianco); border-radius: 14px; padding: 1.75rem; box-shadow: var(--ombra); }
.persona-badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }
.badge-direzione { background: rgba(201,125,46,0.1); color: var(--ambra); }
.badge-acquisti { background: rgba(104,69,139,0.1); color: var(--viola); }
.badge-segreteria { background: rgba(27,58,107,0.1); color: var(--blu); }
.badge-it { background: rgba(45,106,79,0.1); color: var(--verde); }
.badge-dpo { background: rgba(192,57,43,0.1); color: var(--rosso); }
.badge-docenti { background: #e8e4dc; color: #5e6166; }
.persona-role { font-size: 1.2rem; font-weight: 700; color: var(--blu); margin-bottom: 0.25rem; }
.persona-focus { font-size: 0.85rem; color: var(--grigio); margin-bottom: 1.25rem; }
.persona-section { margin-bottom: 1rem; }
.persona-section h4 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--grigio); margin-bottom: 0.4rem; font-family: 'IBM Plex Mono', monospace; }
.persona-section p { font-size: 0.875rem; line-height: 1.6; color: #374151; }
.prompt-list { list-style: none; }
.prompt-list li { padding: 0.6rem 0; border-bottom: 1px solid var(--gc); font-size: 0.875rem; line-height: 1.5; color: #374151; display: flex; gap: 0.5rem; }
.prompt-list li:last-child { border-bottom: none; }
.prompt-list li::before { content: "→"; color: var(--ambra); font-weight: 700; flex-shrink: 0; }
.w3-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
.w3-card { background: var(--bianco); border-radius: 14px; padding: 1.5rem; box-shadow: var(--ombra); }
.w3-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.25rem; }
.w3-what { color: var(--blu); }
.w3-sowhat { color: var(--ambra); }
.w3-nowwhat { color: var(--verde); }
.w3-question { font-size: 0.875rem; color: #374151; line-height: 1.6; margin-bottom: 1rem; }
</style>
</head>
<body>
    <div id="phaseTabs" class="phases-bar"></div>
    <main>
        <div id="app"></div>
    </main>
<script>
let state = {}, groups = {}, myId = null, myRole = null, isFacilitatore = false;

const PHASES=[
 {id:'scenario',title:'Scenario',min:2,kind:'info'},
 {id:'disaster',title:'Progetta il disastro',min:5,kind:'multi'},
 {id:'crisis',title:'Crisi dinamica',min:3,kind:'crisis'},
 {id:'blame',title:'Litighiamo bene',min:4,kind:'single'},
 {id:'silos',title:'Basta silos',min:3,kind:'single'},
 {id:'stop',title:'Stop Doing List',min:4,kind:'multi'},
 {id:'report',title:'Report finale',min:0,kind:'report'}
];
const ROLES={
 direzione:{name:'Direzione / Governance PNRR',short:'Direzione',desc:'Fondi, milestone, rendicontazione, reputazione istituzionale.',color:'b-dg',mantra:'Abbiamo scadenze, indicatori e fondi: non possiamo restare fermi.'},
 acquisti:{name:'Ufficio acquisti / RUP / DEC',short:'RUP',desc:'Capitolato, affidamento, SAL, collaudo, clausole e documentazione.',color:'b-acq',mantra:'Se volete log, audit e limiti d’uso, dovete dirmelo prima del capitolato.'},
 segreteria:{name:'Segreteria studenti / Front office',short:'Segreteria',desc:'Ticket, email, studenti arrabbiati, tempi impossibili.',color:'b-op',mantra:'A me serve uno strumento che risponda subito, non un tavolo tra due mesi.'},
 it:{name:'IT / RTD / Sistemi informativi',short:'IT/RTD',desc:'Sicurezza, integrazione, account, log, strumenti autorizzati.',color:'b-it',mantra:'Se ognuno usa il tool che vuole, poi il problema diventa nostro.'},
 dpo:{name:'DPO / Privacy / Compliance',short:'DPO',desc:'Dati personali, studenti fragili, DPIA, trasparenza, accountability.',color:'b-dpo',mantra:'Prima ditemi quali dati trattate, dove finiscono e chi li vede.'},
 docenti:{name:'Docenti / Commissioni / Area didattica',short:'Docenti',desc:'Autonomia valutativa, merito, prove artistiche, ammissioni, anti-plagio.',color:'b-st',mantra:'La valutazione non è un ticket amministrativo.'}
};
const DISASTER_MOVES={
 direzione:[
  {t:'Annunciare il progetto IA prima di definire ruoli, policy e perimetro.',cat:'pnrr',bad:true},
  {t:'Spingere per partire subito perché ci sono milestone PNRR da rendicontare.',cat:'pnrr',bad:true},
  {t:'Chiedere agli uffici di sperimentare liberamente “purché funzioni”.',cat:'shadow',bad:true},
  {t:'Misurare il successo solo sulla riduzione dei ticket e dei tempi di risposta.',cat:'chatbot',bad:true},
  {t:'Convocare DPO, IT e RUP solo quando il progetto è già deciso.',cat:'procurement',bad:true},
  {t:'Soluzione sbagliata ma seducente: nominare un “responsabile IA” e lasciare tutto uguale.',cat:'governance',bad:true}
 ],
 acquisti:[
  {t:'Accettare “sistema conforme all’AI Act” senza documentazione verificabile.',cat:'procurement',bad:true},
  {t:'Non chiedere log, audit, localizzazione dati, metriche, limiti d’uso e subfornitori.',cat:'procurement',bad:true},
  {t:'Fare il capitolato sulle funzionalità, non sui controlli e sulle responsabilità.',cat:'pnrr',bad:true},
  {t:'Non prevedere clausole sugli aggiornamenti del modello e sulla portabilità dei dati.',cat:'procurement',bad:true},
  {t:'Collaudare perché “la piattaforma si accende”, anche se non è ispezionabile.',cat:'pnrr',bad:true},
  {t:'Soluzione sbagliata: farsi mandare una brochure rassicurante e archiviarla come prova.',cat:'procurement',bad:true}
 ],
 segreteria:[
  {t:'Usare strumenti gratuiti con testi reali perché “serve solo una bozza”.',cat:'shadow',bad:true},
  {t:'Far rispondere il chatbot anche su termini, benefici, esclusioni, tasse e reclami.',cat:'chatbot',bad:true},
  {t:'Non salvare le risposte date agli studenti: “tanto era solo orientamento”.',cat:'chatbot',bad:true},
  {t:'Usare l’output IA come comunicazione pronta quando la coda delle mail esplode.',cat:'shadow',bad:true},
  {t:'Non segnalare errori perché non c’è tempo e “si aggiusterà alla prossima risposta”.',cat:'governance',bad:true},
  {t:'Soluzione sbagliata: aggiungere un disclaimer lunghissimo e continuare come prima.',cat:'chatbot',bad:true}
 ],
 it:[
  {t:'Attivare sistemi senza mappare i procedimenti su cui impattano.',cat:'governance',bad:true},
  {t:'Dare account e accessi prima che esista una policy interna.',cat:'shadow',bad:true},
  {t:'Prevedere log tecnici non comprensibili dagli uffici che devono motivare gli atti.',cat:'procurement',bad:true},
  {t:'Trattare il problema come solo sicurezza informatica, non come effetto amministrativo.',cat:'governance',bad:true},
  {t:'Non sapere quali strumenti AI siano già usati dagli uffici.',cat:'shadow',bad:true},
  {t:'Soluzione sbagliata: bloccare tutto tecnicamente senza offrire alternative autorizzate.',cat:'governance',bad:true}
 ],
 dpo:[
  {t:'Arrivare solo a contratto firmato e progetto comunicato agli uffici.',cat:'procurement',bad:true},
  {t:'Dire solo “serve DPIA” senza indicare condizioni operative e punti di controllo.',cat:'governance',bad:true},
  {t:'Non distinguere uso di supporto, uso decisionale e profilazione.',cat:'profilazione',bad:true},
  {t:'Non presidiare casi con studenti vulnerabili, DSA, disabilità, carriere e benefici.',cat:'profilazione',bad:true},
  {t:'Non pretendere trasparenza verso studenti, candidati e personale.',cat:'governance',bad:true},
  {t:'Soluzione sbagliata: vietare tutto verbalmente, così gli uffici useranno shadow AI.',cat:'shadow',bad:true}
 ],
 docenti:[
  {t:'Usare tool anti-AI writing come prova definitiva contro lo studente.',cat:'valutazione',bad:true},
  {t:'Far sintetizzare all’IA giudizi qualitativi su elaborati, prove artistiche o portfolio.',cat:'valutazione',bad:true},
  {t:'Usare IA per ordinare candidati o portfolio prima della discussione collegiale.',cat:'valutazione',bad:true},
  {t:'Non dichiarare l’uso di strumenti IA perché “era solo supporto personale”.',cat:'shadow',bad:true},
  {t:'Considerare la valutazione didattica fuori dalla governance dell’ente.',cat:'governance',bad:true},
  {t:'Soluzione sbagliata: affidarsi al tool perché “almeno è oggettivo”.',cat:'valutazione',bad:true}
 ]
};
const CRISES={
 pnrr:{title:'Crisi PNRR · Il progetto deve correre, ma nessuno riesce a collaudare davvero',cat:'PNRR / rendicontazione',text:'Il progetto finanziato è partito rapidamente. La piattaforma AI è stata presentata come “chiavi in mano”, ma al momento del collaudo mancano log comprensibili, metriche di accuratezza, istruzioni d’uso complete e dettagli sugli aggiornamenti del modello. La Direzione deve rendicontare l’avanzamento, il RUP chiede documentazione, gli uffici hanno già iniziato a usarla.',spark:'Non possiamo perdere il finanziamento. Ma possiamo collaudare una scatola nera?'},
 procurement:{title:'Crisi acquisti · Il fornitore promette conformità, ma consegna una scatola nera',cat:'Procurement / contratto',text:'Nel contratto non sono stati scritti requisiti chiari su log, audit, localizzazione dati, divieto di riuso, limiti d’uso e aggiornamenti del modello. Ora l’ente chiede evidenze e il fornitore risponde con slide commerciali. Intanto alcuni uffici hanno già caricato dati reali.',spark:'Se non lo chiedi nel capitolato, dopo lo paghi due volte: in soldi e in responsabilità.'},
 shadow:{title:'Crisi Shadow AI · Gli uffici hanno già fatto da soli',cat:'Shadow AI',text:'Si scopre che più uffici usano strumenti AI gratuiti o non autorizzati per riscrivere email, riassumere documenti, preparare FAQ e sintetizzare richieste degli studenti. Alcuni prompt contenevano dati reali, matricole, situazioni personali e bozze di atti interni. Nessuno sa quanti strumenti siano in uso.',spark:'Lo facevamo per lavorare meglio. Il problema è che nessuno lo sapeva.'},
 chatbot:{title:'Crisi chatbot · Da FAQ a sportello parallelo',cat:'Front office / chatbot',text:'Il chatbot, nato per orientamento e informazioni generali, ha iniziato a rispondere anche su scadenze, benefici, ammissioni, tasse e reclami. Alcuni studenti hanno seguito risposte errate. L’ente riceve contestazioni e richieste di riesame.',spark:'Non è più orientamento quando la risposta incide su termini, benefici o esclusioni.'},
 valutazione:{title:'Crisi valutazione · Il tool diventa prova senza che nessuno lo ammetta',cat:'Didattica / commissioni',text:'Una commissione ha usato un tool anti-AI writing o un sistema di sintesi automatica per supportare la valutazione di elaborati, prove artistiche o candidature. Uno studente contesta l’esito, chiede accesso agli atti e vuole sapere quale peso abbia avuto il sistema IA nella valutazione.',spark:'Era solo un supporto. Però ha inciso sull’esito.'},
 profilazione:{title:'Crisi profilazione · L’aiuto diventa etichetta',cat:'Studenti / dati / rischio abbandono',text:'L’ente usa un sistema predittivo per individuare studenti “a rischio abbandono” e indirizzarli verso servizi di supporto. Alcuni studenti scoprono di essere stati classificati e contestano il trattamento, temendo stigma e conseguenze sulla carriera.',spark:'La finalità positiva non elimina il rischio di etichettare le persone.'},
 governance:{title:'Crisi governance · Tutti avevano un pezzo, nessuno aveva il quadro',cat:'Governance / silos',text:'Ogni ufficio ha fatto una scelta ragionevole dal proprio punto di vista: velocità, efficienza, sicurezza, privacy, didattica, capitolato. Ma nessuno ha ricostruito l’intero ciclo di vita del sistema. Quando arriva la contestazione, la catena di responsabilità è opaca.',spark:'Il problema non è un ufficio: è l’ente che non si è parlato.'}
};
const BLAME=[
 {t:'La colpa è del fornitore: aveva detto che era tutto conforme.',score:0,why:'Seducente ma sbagliata: il fornitore risponde contrattualmente, ma l’ente deve governare uso, dati e procedimento.'},
 {t:'La colpa è degli uffici: hanno usato strumenti non autorizzati.',score:.5,why:'Parziale: vero se c’è shadow AI, ma spesso manca anche una policy praticabile.'},
 {t:'La colpa è della Direzione: ha spinto su tempi e PNRR senza tavolo di governance.',score:.5,why:'Parziale: la pressione dall’alto conta, ma non spiega da sola il fallimento.'},
 {t:'La colpa è del DPO/IT/RUP, che rallentano sempre e arrivano con problemi.',score:0,why:'Risposta difensiva: trasforma i presidi in ostacoli e non vede il rischio sistemico.'},
 {t:'La colpa è del modello organizzativo: ciascuno ha difeso il proprio silos.',score:1,why:'Risposta più forte: il disastro nasce dalla somma di decisioni separate.'},
 {t:'Non è colpa di nessuno: l’IA è nuova, gli errori sono inevitabili.',score:0,why:'Pericolosa: normalizza l’assenza di governance.'}
];
const SILOS=[
 {t:'Direzione senza governance: urgenza, fondi e reputazione prima dei presidi.',score:.75},
 {t:'Acquisti senza requisiti: contratto funzionale ma non ispezionabile.',score:.75},
 {t:'Tecnologia senza procedimento: sicurezza tecnica senza impatto amministrativo.',score:.75},
 {t:'Privacy/compliance coinvolta troppo tardi.',score:.75},
 {t:'Didattica/commissioni fuori dal perimetro comune.',score:.75},
 {t:'Tutti i precedenti: nessun tavolo unico, nessuna responsabilità ricomposta.',score:1},
 {t:'Nessun silos: basta una circolare della Direzione.',score:0}
];
const STOP=[
 {t:'Smettere di usare strumenti AI non autorizzati con dati reali.',score:1},
 {t:'Smettere di acquistare AI senza requisiti su log, audit, dati, limiti, aggiornamenti e subfornitori.',score:1},
 {t:'Smettere di far rispondere chatbot su diritti, termini, benefici, esclusioni senza escalation.',score:1},
 {t:'Smettere di usare output AI come motivazione, prova o valutazione definitiva.',score:1},
 {t:'Smettere di coinvolgere DPO, IT, RUP, responsabili procedimento solo alla fine.',score:1},
 {t:'Smettere di misurare l’innovazione solo su velocità, ticket ridotti e rendicontazione.',score:1},
 {t:'Soluzione finta: aggiungere un disclaimer generale e continuare come prima.',score:0},
 {t:'Soluzione finta: nominare un responsabile IA senza cambiare processi e contratti.',score:0},
 {t:'Soluzione finta: bloccare tutto senza offrire strumenti autorizzati e formazione.',score:.25}
];
const POLLS={blame:BLAME,silos:SILOS,stop:STOP};

function byId(id) { return document.getElementById(id); }
function esc(s){return String(s||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function phase(){return PHASES[state.phase]||PHASES[0];}
function hasVoted(kind,id=myId){return groups?.[id]?.votes?.[kind]!==undefined;}
function currentGroup(){return groups?.[myId]||null;}
function getVotesFor(kind){const vs=[];Object.entries(groups||{}).forEach(([id,g])=>{const v=g.votes?.[kind]; if(v!==undefined&&v!==null)vs.push({id,...g,value:v});});return vs;}
function groupChoicesSummary(g){let out=[]; if(g?.votes?.disaster){const arr=Array.isArray(g.votes.disaster)?g.votes.disaster:[]; out.push('Mosse: '+arr.map(i=>DISASTER_MOVES[g.role]?.[i]?.t||'').filter(Boolean).join(' · '));} if(g?.votes?.blame!==undefined) out.push('Colpa: '+(BLAME[g.votes.blame]?.t||'')); if(g?.votes?.silos!==undefined) out.push('Silos: '+(SILOS[g.votes.silos]?.t||'')); if(g?.votes?.stop) out.push('Stop: '+g.votes.stop.map(i=>STOP[i]?.t||'').filter(Boolean).join(' · ')); return out.join('<br>');}
function disasterScores(){const scores={pnrr:0,procurement:0,shadow:0,chatbot:0,valutazione:0,profilazione:0,governance:0};Object.values(groups||{}).forEach(g=>{const moves=DISASTER_MOVES[g.role]||[];(g.votes?.disaster||[]).forEach(i=>{const cat=moves[i]?.cat;if(cat)scores[cat]=(scores[cat]||0)+1;});});return scores;}
function chosenCrisisKey(){if(state.forcedCrisis&&CRISES[state.forcedCrisis])return state.forcedCrisis;const scores=disasterScores();let best='governance',max=-1;const priority=['pnrr','procurement','shadow','chatbot','valutazione','profilazione','governance'];priority.forEach(k=>{if((scores[k]||0)>max){max=scores[k];best=k;}});return best;}
function reveal(kind){return !!state.reveal?.[kind];}
function resultData(kind){let opts=kind==='disaster'?null:POLLS[kind];const votes=getVotesFor(kind);if(kind==='disaster'){const counts={};const voters={};Object.entries(groups||{}).forEach(([id,g])=>{const moves=DISASTER_MOVES[g.role]||[];(g.votes?.disaster||[]).forEach(i=>{const label=(moves[i]?.cat||'altro').toUpperCase();counts[label]=(counts[label]||0)+1;(voters[label]=voters[label]||[]).push(g.name+' · '+(ROLES[g.role]?.short||g.role));});});return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).map(label=>({label,count:counts[label],pct:votes.length?Math.round(counts[label]/Math.max(1,votes.length*3)*100):0,voters:voters[label]||[]}));}
const counts=opts.map(()=>0),voters=opts.map(()=>[]);votes.forEach(v=>{if(kind==='stop'){(v.value||[]).forEach(i=>{counts[i]++;voters[i].push(v.name+' · '+(ROLES[v.role]?.short||v.role));});}else{counts[v.value]++;voters[v.value].push(v.name+' · '+(ROLES[v.role]?.short||v.role));}});const total=kind==='stop'?Math.max(1,votes.length):Math.max(1,votes.length);return opts.map((o,i)=>({label:o.t,count:counts[i],pct:Math.round((counts[i]/total)*100),voters:voters[i]||[],score:o.score}));}
function resultsHTML(kind,showVoters=true,showPct=true){const data=resultData(kind);if(!data.length)return '<p class="muted">Nessuna risposta ancora.</p>';return `<div class="result-list">${data.map(r=>`<div class="resrow"><div class="reshead"><div class="reslabel">${esc(r.label)}</div>${showPct?`<div class="respct">${r.pct}%</div>`:''}</div>${showPct?`<div class="resbar"><div class="resfill" style="width:${r.pct}%;background:${r.score===0?'var(--rosso)':r.score<1?'var(--ambra)':'var(--verde)'}"></div></div>`:''}${showVoters?`<div class="voters"><strong>${r.count}</strong> · ${r.voters.map(esc).join(', ')||'—'}</div>`:''}</div>`).join('')}</div>`;}

function renderTabs(){const el=byId('phaseTabs');el.innerHTML=PHASES.map((p,i)=>`<div class="ptab ${i===state.phase?'active':''} ${i<state.phase?'done':''}"><span class="tt">${String(i+1).padStart(2,'0')}</span>${esc(p.title)}</div>`).join('');}
function render(){if(!myId)return;renderTabs();const app=byId('app');app.innerHTML=isFacilitatore?facHTML():participantHTML();attachHandlers();}
function participantHTML(){const g=currentGroup();const p=phase();const r=ROLES[g.role];let inner='';if(p.id==='scenario')inner=scenarioHTML()+roleCard(g);else if(p.id==='disaster')inner=disasterParticipant(g);else if(p.id==='crisis')inner=crisisHTML(false);else if(p.id==='blame')inner=pollParticipant('blame','Di chi è la colpa?', 'Scegliete la frase difensiva che usereste al tavolo. Alcune sono molto seducenti e molto sbagliate.');else if(p.id==='silos')inner=pollParticipant('silos','Quale silos ha creato il disastro?', 'Ora proviamo a smettere di difenderci: dov’è il difetto di governance?');else if(p.id==='stop')inner=pollParticipant('stop','Stop Doing List', 'Scegliete massimo 3 cose che l’ente deve smettere di fare da domani. Attenzione: ci sono anche finte soluzioni.');else inner=reportParticipant();return `<div class="layout"><div>${inner}</div></div>`;}
function scenarioHTML(){return `<div class="card ambra"><div class="eyebrow">Scenario comune</div><div class="ctitle">Il tavolo di governance è convocato. Purtroppo.</div><div class="cbody">L’ente deve introdurre strumenti di IA generativa e assistenti AI per sportello studenti, ticket, comunicazione istituzionale, supporto alle segreterie, analisi dati, commissioni e bozze di atti. Ci sono fondi, scadenze, obiettivi e pressione reputazionale. Ogni ufficio porta una ragione vera. Il problema è che, se restano separate, diventano tutte pericolose.</div><div class="quote">Per qualche minuto siete autorizzati a difendere il vostro silos nel modo più corporativo possibile. Poi torniamo ente pubblico.</div></div>`;}
function roleCard(g){const r=ROLES[g.role];return `<div class="card"><div class="eyebrow">Il vostro ruolo</div><div class="ctitle">${esc(r.name)}</div><p class="cbody">${esc(r.desc)}</p><div class="hbox"><strong>Frase tipica:</strong><br>${esc(r.mantra)}</div></div>`;}
function disasterParticipant(g){const done=hasVoted('disaster');const moves=DISASTER_MOVES[g.role]||[];const chosen=g.votes?.disaster||[];return `<div class="card rosso"><div class="eyebrow">TRIZ · Progetta il disastro</div><div class="ctitle">Scegliete 3 mosse per far fallire la governance IA</div><p class="cbody">Dovete ragionare dal vostro silos, senza generosità. Quali comportamenti renderebbero il progetto più rischioso?</p><div class="opts" id="disasterOpts">${moves.map((m,i)=>`<div class="opt bad ${chosen.includes(i)?'sel':''} ${done?'locked':''}" data-i="${i}"><div class="olabel">${esc(m.t)}</div><div class="odesc">Area di crisi: ${esc(m.cat.toUpperCase())}</div></div>`).join('')}</div>${done?'<div class="locknote">Risposta acquisita. Non potete più modificarla.</div>':'<div class="btnrow"><button class="save-btn" id="saveDisaster">Conferma le 3 mosse</button></div><p class="muted">Selezionate esattamente 3 opzioni.</p>'}</div>`;}
function crisisHTML(forFac){const key=chosenCrisisKey();const c=CRISES[key];const scores=disasterScores();return `<div class="card rosso"><div class="eyebrow">Crisi dinamica · ${esc(c.cat)}</div><div class="ctitle">${esc(c.title)}</div><p class="cbody">${esc(c.text)}</p><div class="dangerbox"><strong>Benzina sul fuoco:</strong><br>${esc(c.spark)}</div></div>${forFac?`<div class="card"><div class="eyebrow">Chi ha alimentato questa crisi</div>${resultsHTML('disaster',true,true)}<div class="hbox"><strong>Facoltativo:</strong> se serve per la regia d’aula, puoi forzare una crisi diversa dal pannello laterale.</div></div>`:''}`;}
function pollParticipant(kind,title,subtitle){const done=hasVoted(kind);const vals=currentGroup()?.votes?.[kind];const opts=POLLS[kind];const multi=kind==='stop';return `<div class="card ${kind==='stop'?'verde':'ambra'}"><div class="eyebrow">${kind==='stop'?'Ricomposizione':'Role play'}</div><div class="ctitle">${esc(title)}</div><p class="cbody">${esc(subtitle)}</p><div class="opts" id="pollOpts" data-kind="${kind}" data-multi="${multi}">${opts.map((o,i)=>{const sel=multi?((vals||[]).includes(i)):vals===i;return `<div class="opt ${sel?'sel':''} ${done?'locked':''} ${o.score===0?'bad':o.score===1?'good':''}" data-i="${i}"><div class="olabel">${esc(o.t)}</div>${o.why?`<div class="odesc">${esc(o.why)}</div>`:''}</div>`}).join('')}</div>${done?'<div class="locknote">Voto acquisito. Non potete più cambiarlo.</div>':`<div class="btnrow"><button class="save-btn" id="savePoll">Conferma ${multi?'le scelte':'la scelta'}</button></div><p class="muted">${multi?'Massimo 3 opzioni.':'Una sola opzione.'} I partecipanti non vedono percentuali o voti degli altri.</p>`}</div>`;}
function reportParticipant(){return `<div class="card verde"><div class="eyebrow">Chiusura</div><div class="ctitle">Il report lo scarica la facilitatrice</div><p class="cbody">Grazie: le vostre scelte hanno alimentato la Stop Doing List finale. Ora si ricompone il tavolo e si porta a casa il metodo.</p></div>`;}
function facHTML(){return `<div class="layout fac"><div>${facMain()}</div><aside>${facSide()}</aside></div>`;}
function facMain(){const p=phase();if(p.id==='scenario')return scenarioHTML()+`<div class="card"><div class="ctitle">Regia</div><p class="cbody">Fai entrare i gruppi con il QR. Il timer parte solo da qui, dal pannello facilitatrice.</p></div>`;if(p.id==='disaster')return `<div class="card rosso"><div class="eyebrow">Fase attiva</div><div class="ctitle">I gruppi stanno scegliendo le mosse-disastro</div><p class="cbody">Sul tuo pannello vedi sempre gruppi, ruoli e scelte. Sul proiettore puoi mostrare timer e, quando fermi, i risultati aggregati.</p></div><div class="card"><div class="ctitle">Mosse scelte per area di crisi</div>${resultsHTML('disaster',true,true)}</div>`;if(p.id==='crisis')return crisisHTML(true);if(p.id==='blame')return `<div class="card ambra"><div class="eyebrow">Litighiamo bene</div><div class="ctitle">Di chi è la colpa?</div><p class="cbody">Qui devi vedere chi vota cosa: serve per accendere il conflitto controllato.</p></div><div class="card"><div class="ctitle">Voti per gruppo</div>${resultsHTML('blame',true,true)}</div>`;if(p.id==='silos')return `<div class="card ambra"><div class="eyebrow">Basta silos</div><div class="ctitle">Quale silos ha creato il disastro?</div><p class="cbody">Dopo la difesa corporativa, riportali alla responsabilità organizzativa.</p></div><div class="card"><div class="ctitle">Voti per gruppo</div>${resultsHTML('silos',true,true)}</div>`;if(p.id==='stop')return `<div class="card verde"><div class="eyebrow">Stop Doing List</div><div class="ctitle">Cosa smettiamo di fare da domani?</div><p class="cbody">Qui ci sono anche finte soluzioni: disclaimer, responsabile nominale, blocco totale senza alternativa.</p></div><div class="card"><div class="ctitle">Scelte finali</div>${resultsHTML('stop',true,true)}</div>`;return `<div class="card verde"><div class="eyebrow">Report finale</div><div class="ctitle">Scarica il report PDF</div><p class="cbody">Il PDF contiene scenario, crisi generata, mosse scelte, voti per gruppo e Stop Doing List.</p><div class="btnrow"><button class="nbtn green" id="pdfBtn">Scarica PDF</button></div></div>`;}
function facSide(){const p=phase();return `<div class="fac-panel"><h3>Controlli facilitatrice</h3><div class="btnrow"><button class="nbtn" id="start2">Avvia timer</button><button class="nbtn alt" id="stop2">Stop + rivela risultati</button><button class="nbtn alt" id="prev2">Indietro</button><button class="nbtn" id="next2">Passa fase</button><button class="nbtn danger" id="reset2">Reset</button></div><div class="statgrid"><div class="stat"><div class="statn">${Object.keys(groups).length}</div><div class="statl">gruppi</div></div><div class="stat"><div class="statn">${getVotesFor(p.id).length}</div><div class="statl">voti fase</div></div><div class="stat"><div class="statn">${reveal(p.id)?'SÌ':'NO'}</div><div class="statl">risultati</div></div></div></div><div class="fac-panel"><h3>QR partecipanti</h3><div id="qrFac" style="background:white;display:inline-block;padding:8px;border-radius:8px"></div><div class="muted" style="margin-top:.5rem;word-break:break-all">${esc(parent.BASE_URL)}</div></div><div class="fac-panel"><h3>Crisi dinamica</h3><div class="muted">Crisi attuale: <strong>${esc(CRISES[chosenCrisisKey()].cat)}</strong></div><select id="forceCrisis" style="width:100%;margin-top:.55rem;padding:.55rem;border:1px solid var(--gc);border-radius:7px"><option value="">Automatica dalle scelte</option>${Object.entries(CRISES).map(([k,c])=>`<option value="${k}" ${state.forcedCrisis===k?'selected':''}>${esc(c.cat)}</option>`).join('')}</select></div><div class="fac-panel"><h3>Gruppi e scelte</h3><div class="group-list">${Object.entries(groups).map(([id,g])=>`<div class="gcard"><div class="gname">${esc(g.name||id)}</div><div class="grole">${esc(ROLES[g.role]?.name||g.role)}</div><div class="gchoices">${groupChoicesSummary(g)||'<span class="muted">Nessuna scelta ancora</span>'}</div></div>`).join('')||'<p class="muted">Nessun gruppo entrato.</p>'}</div></div>`;}
function attachHandlers(){['start2'].forEach(id=>{const el=document.getElementById(id);if(el)el.onclick=()=>parent.startTimer()});['stop2'].forEach(id=>{const el=document.getElementById(id);if(el)el.onclick=()=>parent.stopTimer(false)});const n=document.getElementById('next2');if(n)n.onclick=()=>parent.nextPhase();const pr=document.getElementById('prev2');if(pr)pr.onclick=()=>parent.prevPhase();const rs=document.getElementById('reset2');if(rs)rs.onclick=()=>parent.resetLab();const fc=document.getElementById('forceCrisis');if(fc)fc.onchange=()=>parent.rootRef.child('state/forcedCrisis').set(fc.value||null);const pdf=document.getElementById('pdfBtn');if(pdf)pdf.onclick=()=>parent.generatePDF();setTimeout(()=>{const q=document.getElementById('qrFac'); if(q&&window.QRCode){q.innerHTML='';new QRCode(q,{text:parent.BASE_URL,width:120,height:120,colorDark:'#1B3A6B',colorLight:'#ffffff'});}},50);
const dis=document.getElementById('disasterOpts');if(dis){let sel=[];dis.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(hasVoted('disaster'))return;const i=+o.dataset.i;if(sel.includes(i)){sel=sel.filter(x=>x!==i);o.classList.remove('sel');}else if(sel.length<3){sel.push(i);o.classList.add('sel');}});const b=document.getElementById('saveDisaster');if(b)b.onclick=()=>{if(sel.length!==3){alert('Scegli esattamente 3 mosse-disastro.');return;}parent.postMessage({type:'VOTE',pollId:'disaster',value:sel},'*');};}
const po=document.getElementById('pollOpts');if(po){const kind=po.dataset.kind;const multi=po.dataset.multi==='true';let sel=[];po.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(hasVoted(kind))return;const i=+o.dataset.i;if(multi){if(sel.includes(i)){sel=sel.filter(x=>x!==i);o.classList.remove('sel');}else if(sel.length<3){sel.push(i);o.classList.add('sel');}}else{sel=[i];po.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');}});const b=document.getElementById('savePoll');if(b)b.onclick=()=>{if(!sel.length){alert('Scegli almeno una risposta.');return;}parent.postMessage({type:'VOTE',pollId:kind,value:multi?sel:sel[0]},'*');};}}

window.addEventListener('message', (e) => {
    if (e.data.type === 'STATE_UPDATE') {
        state = e.data.state;
        groups = e.data.groups;
        myId = e.data.myId;
        myRole = e.data.myRole;
        isFacilitatore = e.data.isFacilitatore;
        render();
    }
});

</script>
</body>
</html>
